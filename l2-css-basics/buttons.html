<!-- CSS styles HTML -->
<style>
    .subscribe-button {
        background-color: rgb(202, 13, 13);
        color: white;
        border: none;
        height: 36px;
        width: 105px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 8px;
    }
    .join-button {
        background-color: rgb(255,255,255);
        color: rgb(18, 98, 163);
        border-color: rgb(18, 98, 163);
        border-style: solid;
        border-width: 1px;
        height: 36px;
        width: 60px;
        cursor: pointer;
        border-radius: 2px;
    }
    .tweet-button {
        background-color: rgb(4, 132, 201);
        color: white;
        border: none;
        border-radius: 18px;
        height: 36px;
        width: 74px;
        font-weight: bold;
        font-size: 15;
        cursor: pointer;
        margin-left: 8px;
    }
</style>

<!-- class attribute sets a label to the button-->
<button class="subscribe-button">
    SUBSCRIBE
</button>

<button class="join-button">
    JOIN
</button>

<button class="tweet-button">
    Tweet
</button>
